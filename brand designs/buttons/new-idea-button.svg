<svg xmlns="http://www.w3.org/2000/svg" width="122" height="52" viewBox="0 0 122 52" fill="none" role="img" aria-label="New idea button">
  <defs>
    <linearGradient id="buttonFill" x1="7" y1="13" x2="115" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff67d8"/>
      <stop offset="0.42" stop-color="#8d45ff"/>
      <stop offset="1" stop-color="#4d6dff"/>
    </linearGradient>
    <linearGradient id="buttonRim" x1="9" y1="12" x2="113" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0ff"/>
      <stop offset="0.45" stop-color="#ffc8ff"/>
      <stop offset="1" stop-color="#d7e6ff"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="15" y1="13" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="outerGlow" x="-24" y="-14" width="170" height="80" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#ff4fd8" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6.5" flood-color="#5a5cff" flood-opacity="0.62"/>
    </filter>
    <filter id="innerSoft" x="4" y="8" width="114" height="38" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>
  </defs>

  <rect x="6" y="10" width="110" height="34" rx="17" fill="url(#buttonFill)" filter="url(#outerGlow)"/>
  <rect x="6.75" y="10.75" width="108.5" height="32.5" rx="16.25" stroke="url(#buttonRim)" stroke-width="1.5"/>
  <path d="M19 14.25C31 11.6 49.5 12.9 72.5 15.9C54 15.2 35.5 15 18.5 18.9C16.25 19.42 15.75 14.98 19 14.25Z" fill="url(#topSheen)" opacity="0.92" filter="url(#innerSoft)"/>
  <path d="M25.6 21.6V30.4M21.2 26H30" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="39" y="30.7" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0">New idea</text>
